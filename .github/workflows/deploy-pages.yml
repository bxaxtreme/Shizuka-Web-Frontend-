name: Deploy Shizuka frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript check
        run: npm run typecheck
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_BASE_PATH: "/Shizuka-Web-Fontend"
          NEXT_PUBLIC_SITE_URL: "https://bxaxtreme.github.io/Shizuka-Web-Fontend/"
      - name: Build static website
        run: npm run build
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_BASE_PATH: "/Shizuka-Web-Fontend"
          NEXT_PUBLIC_SITE_URL: "https://bxaxtreme.github.io/Shizuka-Web-Fontend/"
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
